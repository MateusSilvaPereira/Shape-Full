services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness_dev
      POSTGRES_DB: fitness360
    ports: ["5433:5432"]
    volumes: [fitness360_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness360"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: fitness360-redis
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  fitness360_pg:
